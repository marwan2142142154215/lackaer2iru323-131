# Nginx untuk Fleet Guard
#
# Pakai kalau sudah punya nginx sendiri (bukan Caddy dan bukan Tunnel).
#
#   sudo ln -s /etc/nginx/sites-available/fleet /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fleet.example.my.id

# Diperlukan supaya WebSocket bisa upgrade lewat proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fleet_guard {
    server 127.0.0.1:8787;
    keepalive 32;
}

# --- HTTP: hanya untuk renewal sertifikat -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fleet.example.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fleet.example.my.id;

    ssl_certificate     /etc/letsencrypt/live/fleet.example.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.example.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:FLEET_SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Frame WSS Guard sampai 6 MB; foto lewat HTTP sekitar 2 MB.
    client_max_body_size 8m;

    # Bot memakai IP asli untuk rate limit dan audit. TANPA header ini semua
    # permintaan terlihat berasal dari 127.0.0.1 dan rate limit jadi tidak berguna.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;

    # Dashboard memakai SSE: buffering harus dimatikan.
    location / {
        proxy_pass http://fleet_guard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Koneksi device boleh hidup sangat lama (harian).
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_request_buffering off;
    }

    # Endpoint pairing adalah permukaan publik yang paling sensitif.
    # Tambahkan allowlist di sini kalau prosesnya hanya di IP tertentu:
    #
    # location /api/enroll/pair {
    #     allow 203.0.113.10;   # IP kantor / reader NFC
    #     deny  all;
    #     proxy_pass http://fleet_guard;
    # }

    access_log /var/log/nginx/fleet-guard.access.log;
    error_log  /var/log/nginx/fleet-guard.error.log warn;
}